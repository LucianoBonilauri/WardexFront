<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wardex</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="logo-placeholder" aria-label="Logo de Wardex">
      <img src="imagenes/Logo_final.png" alt="Logo de Wardex" class="logo">
    </div>

    <nav class="main-nav" aria-label="Navegación principal">
      <a class="nav-link is-active" href="#inicio" aria-current="page">Inicio</a>
      <a class="nav-link" href="#para-que-sirve">Para qué sirve</a>
      <a class="nav-link" href="#integraciones">Integraciones</a>
      <a class="nav-link" href="#proyecto">Proyecto</a>
    </nav>

    <a class="login-button" href="#login">Iniciar sesión</a>
  </header>

  <main>
    <section class="hero" id="inicio" aria-labelledby="hero-title">
      <div class="hero-copy">
        <h1 id="hero-title">
          Tu servidor tiene<br>
          puntos debiles,<br>
          <span>Wardex los<br>encuentra primero</span>
        </h1>
      </div>
    </section>

    <section class="description-section" id="para-que-sirve" aria-label="Para qué sirve">
      <div class="hero-action">
        <p>Wardex es un bot de ciberseguridad<br>
          encargado de detectar automáticamente<br>
          <strong>actividad sospechosa</strong> o inusual dentro de<br>
          tu página web
        </p>
        <a class="primary-button" href="#integraciones">Probar Ahora</a>
      </div>
    </section>

    <section class="empty-section" id="integraciones" aria-label="Integraciones"></section>
    <section class="empty-section" id="proyecto" aria-label="Proyecto"></section>
    <section class="empty-section" id="login" aria-label="Inicio de sesión"></section>
  </main>

  <script src="index.js" defer></script>
</body>
</html>
